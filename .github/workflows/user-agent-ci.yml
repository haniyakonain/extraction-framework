name: WikiApi User Agent CI

on:
  push:
    branches: [master, develop]
    paths:
      - 'core/src/main/scala/org/dbpedia/extraction/util/WikiApi.scala'
      - 'pom.xml'
      - '**/pom.xml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'core/src/main/scala/org/dbpedia/extraction/util/WikiApi.scala'
      - 'pom.xml'
      - '**/pom.xml'
  workflow_dispatch:
    inputs:
      test_live_api:
        description: 'Test against live Wikipedia API'
        required: false
        default: false
        type: boolean

env:
  MAVEN_OPTS: -Xmx1024m
  # Custom user agent for CI testing
  CI_USER_AGENT: "DBpediaBot-CI/1.0 (github.com/dbpedia/extraction-framework)"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['11', '17', '21']
        scala: ['2.12', '2.13']
      fail-fast: false

    name: Test Java ${{ matrix.java }} - Scala ${{ matrix.scala }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Display Maven version
        run: mvn --version

      - name: Validate project structure
        run: |
          echo "Checking project structure..."
          ls -la
          find . -name "pom.xml" -type f

      - name: Compile project
        run: mvn clean compile -DskipTests

      - name: Run unit tests
        run: |
          mvn test -Dtest=WikiApiTest \
            -Dwikiapi.test.useragent="$CI_USER_AGENT" \
            -Dwikiapi.test.timeout=30000 \
            -Dmaven.test.failure.ignore=false

      - name: Run integration tests (Mock API)
        run: |
          mvn test -Dtest=WikiApiIntegrationTest \
            -Dwikiapi.test.mock=true \
            -Dwikiapi.test.useragent="$CI_USER_AGENT"

      - name: Test HTTP Client fallback mechanism
        run: |
          mvn test -Dtest=WikiApiHttpClientTest \
            -Dwikiapi.test.httpclient.primary=true \
            -Dwikiapi.test.httpclient.fallback=true \
            -Dwikiapi.test.useragent="$CI_USER_AGENT"

      - name: Test User Agent configurations
        run: |
          mvn test -Dtest=WikiApiUserAgentTest \
            -Dwikiapi.test.useragent.custom="$CI_USER_AGENT" \
            -Dwikiapi.test.useragent.default=true \
            -Dwikiapi.test.useragent.disabled=true

      - name: Test retry mechanism
        run: |
          mvn test -Dtest=WikiApiRetryTest \
            -Dwikiapi.test.retry.maxretries=3 \
            -Dwikiapi.test.retry.timeout=5000

      - name: Generate test reports
        run: mvn surefire-report:report

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-java${{ matrix.java }}-scala${{ matrix.scala }}
          path: |
            target/surefire-reports/
            target/site/surefire-report.html

  live-api-test:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_live_api || github.ref == 'refs/heads/master' }}
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Test against live Wikipedia API
        run: |
          mvn test -Dtest=WikiApiLiveTest \
            -Dwikiapi.test.live=true \
            -Dwikiapi.test.useragent="$CI_USER_AGENT" \
            -Dwikiapi.test.timeout=60000 \
            -Dwikiapi.test.maxretries=3
        env:
          WIKIPEDIA_API_URL: "https://en.wikipedia.org/w/api.php"

      - name: Test rate limiting behavior
        run: |
          mvn test -Dtest=WikiApiRateLimitTest \
            -Dwikiapi.test.ratelimit=true \
            -Dwikiapi.test.useragent="$CI_USER_AGENT"

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security scan
        uses: github/super-linter@v4
        env:
          DEFAULT_BRANCH: master
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_SCALA: true
          VALIDATE_XML: true

      - name: Check for security vulnerabilities
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionsFile=.github/security-suppressions.xml

  performance-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run performance benchmarks
        run: |
          mvn test -Dtest=WikiApiPerformanceTest \
            -Dwikiapi.test.performance=true \
            -Dwikiapi.test.useragent="$CI_USER_AGENT" \
            -Dwikiapi.test.threads=10 \
            -Dwikiapi.test.requests=100

      - name: Compare HTTP Client vs URLConnection performance
        run: |
          mvn test -Dtest=WikiApiHttpMethodComparisonTest \
            -Dwikiapi.test.comparison=true \
            -Dwikiapi.test.useragent="$CI_USER_AGENT"

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Scalastyle
        run: mvn scalastyle:check

      - name: Run SpotBugs
        run: mvn spotbugs:check

      - name: Generate code coverage report
        run: |
          mvn clean test jacoco:report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: target/site/jacoco/jacoco.xml
          flags: wikiapi
          name: wikiapi-coverage

  documentation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Generate Scaladoc
        run: mvn scala:doc

      - name: Deploy documentation
        if: github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site/scaladocs

  notify:
    runs-on: ubuntu-latest
    needs: [test, live-api-test, security-scan, performance-test, code-quality]
    if: always()

    steps:
      - name: Notify on success
        if: needs.test.result == 'success'
        run: |
          echo "✅ WikiApi CI pipeline completed successfully"
          echo "All tests passed with user agent: $CI_USER_AGENT"

      - name: Notify on failure
        if: needs.test.result == 'failure'
        run: |
          echo "❌ WikiApi CI pipeline failed"
          echo "Check the test results for details"
          exit 1
